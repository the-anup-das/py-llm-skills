[project]
name = "py-llm-skills"
version = "0.1.2"
description = "A Python SDK for building LLM with Skills."
readme = "README.md"
authors = [
    { name = "theanupllm", email = "theanupdas@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
dotenv = ["python-dotenv>=1.2.1"]
demo = ["python-dotenv", "openai>=1.0.0", "anthropic>=0.18.0"]
full = ["python-dotenv", "openai>=1.0.0", "anthropic>=0.18.0"]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
